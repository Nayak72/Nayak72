<svg xmlns="http://www.w3.org/2000/svg" width="270" height="190" viewBox="0 0 270 190"><style>@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}} .cur{animation:blink 1s steps(1) infinite}@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}.p0{animation:tw 2.0s ease-in-out infinite 0.0s}.p1{animation:tw 2.7s ease-in-out infinite 0.4s}.p2{animation:tw 3.4s ease-in-out infinite 0.8s}.p3{animation:tw 4.1s ease-in-out infinite 1.2s}@keyframes scan{from{transform:translateY(-20px)}to{transform:translateY(210px)}}.sc{animation:scan 4.5s linear infinite}</style><defs><clipPath id="k"><rect width="270" height="190" rx="16"/></clipPath></defs><rect width="270" height="190" rx="16" fill="#04120a"/><g clip-path="url(#k)"><rect class="sc" width="270" height="14" fill="#b6ff00" opacity=".07"/></g><rect x=".75" y=".75" width="268.5" height="188.5" rx="15.5" fill="none" stroke="#b6ff00" stroke-opacity=".5"/><text x="22" y="34" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Courier New',monospace" font-size="11" letter-spacing="1.6" fill="#b6ff00">[SHORTLIST]</text><rect class="p0" x="224" y="22" width="9" height="9" rx="1.5" fill="#b6ff00"/><rect class="p1" x="236" y="22" width="9" height="9" rx="1.5" fill="#b6ff00"/><rect class="p2" x="224" y="34" width="9" height="9" rx="1.5" fill="#b6ff00"/><rect class="p3" x="236" y="34" width="9" height="9" rx="1.5" fill="#b6ff00"/><text x="22" y="100" font-family="'JetBrains Mono','Fira Code','SF Mono',Menlo,Consolas,'Courier New',monospace" font-weight="700" font-size="44" fill="#b6ff00">Top<tspan font-size="24" font-weight="400" fill="#b8ffc9"> teams</tspan></text><text x="22" y="140" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#a8d9b6">Round 2 of EY Techathon 6.0,</text><text x="22" y="158" font-family="Inter,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#a8d9b6">detailed presentation stage.</text></svg>